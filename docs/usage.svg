<svg xmlns="http://www.w3.org/2000/svg" width="912" height="375" viewBox="0 0 912 375" role="img" aria-label="The wrap-up checklist reaching a real session">
<title>The wrap-up checklist reaching a real session</title>
<rect width="912" height="375" rx="10" fill="#1e1e2e"/>
<circle cx="20" cy="18" r="5" fill="#f38ba8"/><circle cx="38" cy="18" r="5" fill="#f9e2af"/><circle cx="56" cy="18" r="5" fill="#a6e3a1"/>
<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" xml:space="preserve">
<text x="18.0" y="56" fill="#cdd6f4" textLength="716.5" lengthAdjust="spacingAndGlyphs">  The user pressed the Wrap up button. Close this session out cleanly, in this order:</text>
<text x="18.0" y="98" fill="#cdd6f4" textLength="92.7" lengthAdjust="spacingAndGlyphs">  1. Stop. </text>
<text x="110.7" y="98" fill="#7f849c" textLength="514.2" lengthAdjust="spacingAndGlyphs">Start no new work. Running subagents have been told the same.</text>
<text x="18.0" y="119" fill="#cdd6f4" textLength="109.6" lengthAdjust="spacingAndGlyphs">  2. Verify. </text>
<text x="127.6" y="119" fill="#7f849c" textLength="547.9" lengthAdjust="spacingAndGlyphs">Run the checks that fit what changed and report the real results.</text>
<text x="18.0" y="140" fill="#cdd6f4" textLength="92.7" lengthAdjust="spacingAndGlyphs">  3. Docs. </text>
<text x="110.7" y="140" fill="#7f849c" textLength="337.2" lengthAdjust="spacingAndGlyphs">Bring up to date what this work changed.</text>
<text x="18.0" y="161" fill="#cdd6f4" textLength="236.0" lengthAdjust="spacingAndGlyphs">  4. Handoffs and tracking. </text>
<text x="254.0" y="161" fill="#7f849c" textLength="311.9" lengthAdjust="spacingAndGlyphs">Update whatever tracks progress here.</text>
<text x="18.0" y="182" fill="#cdd6f4" textLength="118.0" lengthAdjust="spacingAndGlyphs">  5. Commits. </text>
<text x="136.0" y="182" fill="#7f849c" textLength="396.2" lengthAdjust="spacingAndGlyphs">Ask before committing, then ask before pushing.</text>
<text x="18.0" y="203" fill="#cdd6f4" textLength="109.6" lengthAdjust="spacingAndGlyphs">  6. Report. </text>
<text x="127.6" y="203" fill="#7f849c" textLength="379.3" lengthAdjust="spacingAndGlyphs">What is done, what is not, and the next step.</text>
<text x="18.0" y="245" fill="#cdd6f4" textLength="792.4" lengthAdjust="spacingAndGlyphs">I&#x27;ll wrap up this session following the checklist. Let me start by checking the current state.</text>
<text x="18.0" y="287" fill="#a6adc8" textLength="16.9" lengthAdjust="spacingAndGlyphs">━━</text>
<text x="34.9" y="287" fill="#7f849c" textLength="168.6" lengthAdjust="spacingAndGlyphs">────── 20% context  </text>
<text x="203.5" y="287" fill="#a6adc8" textLength="8.4" lengthAdjust="spacingAndGlyphs">━</text>
<text x="211.9" y="287" fill="#7f849c" textLength="134.9" lengthAdjust="spacingAndGlyphs">─────── 16% 5h  </text>
<text x="346.8" y="287" fill="#a6adc8" textLength="16.9" lengthAdjust="spacingAndGlyphs">━━</text>
<text x="363.6" y="287" fill="#7f849c" textLength="126.4" lengthAdjust="spacingAndGlyphs">────── 26% 7d  </text>
<text x="717.7" y="287" fill="#7f849c" textLength="177.0" lengthAdjust="spacingAndGlyphs">2 todos  AFK  Wrap up</text>
<text x="18.0" y="308" fill="#7f849c" textLength="876.7" lengthAdjust="spacingAndGlyphs">────────────────────────────────────────────────────────────────────────────────────────────────────────</text>
<text x="18.0" y="329" fill="#7f849c" textLength="8.4" lengthAdjust="spacingAndGlyphs">❯</text>
<text x="18.0" y="350" fill="#7f849c" textLength="876.7" lengthAdjust="spacingAndGlyphs">────────────────────────────────────────────────────────────────────────────────────────────────────────</text>
</g>
</svg>
