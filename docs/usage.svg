<svg xmlns="http://www.w3.org/2000/svg" width="912" height="354" viewBox="0 0 912 354" role="img" aria-label="wrap-up alone, running its checklist in a real terminal session">
<title>wrap-up alone, running its checklist in a real terminal session</title>
<rect width="912" height="354" rx="10" fill="#1e1e2e"/>
<circle cx="20" cy="18" r="5" fill="#f38ba8"/><circle cx="38" cy="18" r="5" fill="#f9e2af"/><circle cx="56" cy="18" r="5" fill="#a6e3a1"/>
<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" xml:space="preserve">
<text x="34.9" y="56" fill="#cdd6f4">The user pressed the Wrap up button. Close this session out cleanly, in this order:</text>
<text x="34.9" y="98" fill="#cdd6f4">1. Stop.</text>
<text x="110.7" y="98" fill="#7f849c">Start no new work. Running subagents have been told the same.</text>
<text x="34.9" y="119" fill="#cdd6f4">2. Verify.</text>
<text x="127.6" y="119" fill="#7f849c">Run the checks that fit what changed and report the real results.</text>
<text x="34.9" y="140" fill="#cdd6f4">3. Docs.</text>
<text x="110.7" y="140" fill="#7f849c">Bring up to date what this work changed.</text>
<text x="34.9" y="161" fill="#cdd6f4">4. Handoffs and tracking.</text>
<text x="254.0" y="161" fill="#7f849c">Update whatever tracks progress here.</text>
<text x="34.9" y="182" fill="#cdd6f4">5. Commits.</text>
<text x="136.0" y="182" fill="#7f849c">Ask before committing, then ask before pushing.</text>
<text x="34.9" y="203" fill="#cdd6f4">6. Report.</text>
<text x="127.6" y="203" fill="#7f849c">What is done, what is not, and the next step.</text>
<text x="18.0" y="245" fill="#7f849c">✳ Shenaniganing… (1s · thinking)</text>
<text x="802.0" y="266" fill="#7f849c">Wrapping up</text>
<rect x="18.0" y="282" width="876.7" height="1" fill="#7f849c" fill-opacity=".55"/>
<text x="18.0" y="308" fill="#7f849c">❯</text>
<rect x="18.0" y="324" width="876.7" height="1" fill="#7f849c" fill-opacity=".55"/>
</g>
</svg>
