<svg xmlns="http://www.w3.org/2000/svg" width="912" height="375" viewBox="0 0 912 375" role="img" aria-label="The wrap-up checklist reaching a real session">
<title>The wrap-up checklist reaching a real session</title>
<rect width="912" height="375" rx="10" fill="#1e1e2e"/>
<circle cx="20" cy="18" r="5" fill="#f38ba8"/><circle cx="38" cy="18" r="5" fill="#f9e2af"/><circle cx="56" cy="18" r="5" fill="#a6e3a1"/>
<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" xml:space="preserve">
<text x="34.9" y="56" fill="#cdd6f4">The user pressed the Wrap up button. Close this session out cleanly, in this order:</text>
<text x="34.9" y="98" fill="#cdd6f4">1. Stop.</text>
<text x="110.7" y="98" fill="#7f849c">Start no new work. Running subagents have been told the same.</text>
<text x="34.9" y="119" fill="#cdd6f4">2. Verify.</text>
<text x="127.6" y="119" fill="#7f849c">Run the checks that fit what changed and report the real results.</text>
<text x="34.9" y="140" fill="#cdd6f4">3. Docs.</text>
<text x="110.7" y="140" fill="#7f849c">Bring up to date what this work changed.</text>
<text x="34.9" y="161" fill="#cdd6f4">4. Handoffs and tracking.</text>
<text x="254.0" y="161" fill="#7f849c">Update whatever tracks progress here.</text>
<text x="34.9" y="182" fill="#cdd6f4">5. Commits.</text>
<text x="136.0" y="182" fill="#7f849c">Ask before committing, then ask before pushing.</text>
<text x="34.9" y="203" fill="#cdd6f4">6. Report.</text>
<text x="127.6" y="203" fill="#7f849c">What is done, what is not, and the next step.</text>
<text x="18.0" y="245" fill="#cdd6f4">I&#x27;ll wrap up this session following the checklist. Let me start by checking the current state.</text>
<rect x="18.0" y="281" width="16.9" height="3" rx="1.5" fill="#a6adc8"/>
<rect x="34.9" y="282" width="50.6" height="1" fill="#7f849c" fill-opacity=".55"/>
<text x="93.9" y="287" fill="#7f849c">20% context</text>
<rect x="203.5" y="281" width="8.4" height="3" rx="1.5" fill="#a6adc8"/>
<rect x="211.9" y="282" width="59.0" height="1" fill="#7f849c" fill-opacity=".55"/>
<text x="279.3" y="287" fill="#7f849c">16% 5h</text>
<rect x="346.8" y="281" width="16.9" height="3" rx="1.5" fill="#a6adc8"/>
<rect x="363.6" y="282" width="50.6" height="1" fill="#7f849c" fill-opacity=".55"/>
<text x="422.6" y="287" fill="#7f849c">26% 7d</text>
<text x="717.7" y="287" fill="#7f849c">2 todos  AFK  Wrap up</text>
<rect x="18.0" y="303" width="876.7" height="1" fill="#7f849c" fill-opacity=".55"/>
<text x="18.0" y="329" fill="#7f849c">❯</text>
<rect x="18.0" y="345" width="876.7" height="1" fill="#7f849c" fill-opacity=".55"/>
</g>
</svg>
